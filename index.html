<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>mPc Clone Profile Image</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Hind Siliguri', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        :root {
            --primary: #2563eb;
            --primary-dark: #1d4ed8;
            --secondary: #8b5cf6;
            --accent: #06d6a0;
            --error: #ef4444;
            --warning: #f59e0b;
            --text: #1e293b;
            --text-light: #64748b;
            --bg: #f8fafc;
            --card: #ffffff;
            --shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1);
            --radius: 16px;
        }

        .dark-mode {
            --text: #f1f5f9;
            --text-light: #94a3b8;
            --bg: #0f172a;
            --card: #1e293b;
            --shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.4);
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            transition: all 0.3s ease;
            min-height: 100vh;
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
            -webkit-touch-callout: none;
            -webkit-tap-highlight-color: transparent;
        }

        .container {
            max-width: 400px;
            margin: 0 auto;
            padding: 8px;
            min-height: 100vh;
            position: relative;
        }

        /* Header Styles */
        header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            padding: 5px 0;
            margin-bottom: 20px;
            position: relative;
        }

        .user-profile {
            display: flex;
            align-items: center;
            gap: 12px;
            flex: 1;
        }

        .profile-info {
            flex: 1;
            min-width: 0;
        }

        .profile-name {
            font-weight: 600;
            font-size: 1.1rem;
            margin-bottom: 8px;
            white-space: normal;
            overflow: visible;
            text-overflow: unset;
            line-height: 1.4;
            text-align: left;
            color: var(--text);
        }

        .profile-subtitle {
            font-size: 0.95rem;
            font-weight: 500;
            color: var(--text-light);
            opacity: 0.7;
            text-align: left;
            margin-top: 4px;
        }

        .profile-details {
            font-size: 0.8rem;
            color: var(--text-light);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            text-align: left;
        }

        /* Header Controls */
        .header-controls {
            position: absolute;
            top: 0;
            right: 0;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 8px;
        }

        .timer-container {
            background: var(--primary);
            color: white;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 5px;
            box-shadow: var(--shadow);
        }

        .theme-toggle-header {
            background: var(--card);
            width: 35px;
            height: 35px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 1rem;
            color: var(--text);
            box-shadow: var(--shadow);
            border: none;
            transition: all 0.3s ease;
        }

        .stats-container {
            display: flex;
            gap: 15px;
            margin-top: 10px;
            font-size: 0.8rem;
            color: var(--text-light);
        }

        .stat-item {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        /* Image Grid Styles */
        .image-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 20px;
        }

        .image-card {
            background: var(--card);
            border-radius: var(--radius);
            padding: 12px;
            box-shadow: var(--shadow);
            transition: all 0.3s ease;
            position: relative;
        }

        .image-card.hidden {
            display: none;
        }

        .image-card.downloaded {
            opacity: 0.6;
            filter: grayscale(100%);
        }

        .image-code {
            position: absolute;
            top: 8px;
            left: 8px;
            background: var(--primary);
            color: white;
            padding: 4px 8px;
            border-radius: 20px;
            font-size: 0.7rem;
            font-weight: 600;
            z-index: 2;
        }

        .image-container {
            margin-bottom: 10px;
            border-radius: 12px;
            overflow: hidden;
            position: relative;
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
            pointer-events: none;
        }

        .image-container img {
            width: 100%;
            height: 150px;
            object-fit: cover;
            display: block;
            border-radius: 8px;
            pointer-events: none;
            -webkit-user-drag: none;
            -khtml-user-drag: none;
            -moz-user-drag: none;
            -o-user-drag: none;
            user-drag: none;
        }

        .download-btn {
            background: var(--primary);
            color: white;
            border: none;
            border-radius: var(--radius);
            padding: 10px;
            width: 100%;
            cursor: pointer;
            font-size: 0.8rem;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
        }

        .download-btn:disabled {
            background: var(--text-light);
            cursor: not-allowed;
            opacity: 0.6;
        }

        .download-btn:active:not(:disabled) {
            transform: scale(0.98);
        }

        /* Loading Animation */
        .loading-dots {
            display: inline-block;
        }

        .loading-dots::after {
            content: '';
            animation: dots 1.5s steps(4, end) infinite;
        }

        @keyframes dots {
            0%, 20% { content: ''; }
            40% { content: '.'; }
            60% { content: '..'; }
            80%, 100% { content: '...'; }
        }

        /* Ad System Styles */
        .ad-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 2000;
            backdrop-filter: blur(10px);
        }

        .ad-container {
            background: var(--card);
            border-radius: var(--radius);
            padding: 0;
            max-width: 90%;
            max-height: 80%;
            width: 400px;
            box-shadow: var(--shadow);
            border: 3px solid var(--primary);
            position: relative;
            overflow: hidden;
        }

        .ad-content {
            width: 100%;
            height: 400px;
            display: flex;
            flex-direction: column;
        }

        .ad-iframe {
            width: 100%;
            height: 100%;
            border: none;
            background: white;
        }

        .ad-close-btn {
            position: absolute;
            top: 10px;
            right: 10px;
            background: var(--error);
            color: white;
            border: none;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 1rem;
            font-weight: bold;
            z-index: 2001;
            box-shadow: var(--shadow);
        }

        /* Custom Alert Styles */
        .custom-alert-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            backdrop-filter: blur(5px);
        }

        .custom-alert {
            background: var(--card);
            border-radius: var(--radius);
            padding: 24px;
            box-shadow: var(--shadow);
            max-width: 400px;
            width: 90%;
            border: 2px solid var(--primary);
            animation: slideIn 0.3s ease;
        }

        .custom-alert-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }

        .custom-alert-title {
            font-size: 1.3rem;
            font-weight: 700;
            color: var(--primary);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .custom-alert-close {
            background: none;
            border: none;
            font-size: 1.5rem;
            color: var(--text-light);
            cursor: pointer;
            padding: 4px;
            border-radius: 4px;
            transition: all 0.3s ease;
        }

        .custom-alert-content {
            margin-bottom: 20px;
            line-height: 1.6;
            color: var(--text);
        }

        .custom-alert-buttons {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .custom-alert-btn {
            padding: 12px 20px;
            border: none;
            border-radius: var(--radius);
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-align: center;
        }

        .custom-alert-btn-primary {
            background: var(--primary);
            color: white;
        }

        .custom-alert-btn-secondary {
            background: var(--bg);
            color: var(--text);
            border: 1px solid var(--text-light);
        }

        /* Skeleton Loading */
        .skeleton-loading {
            background: linear-gradient(90deg, #f0f0f0 25%, #e0e0e0 50%, #f0f0f0 75%);
            background-size: 200% 100%;
            animation: loading 1.5s infinite;
            border-radius: var(--radius);
        }

        .dark-mode .skeleton-loading {
            background: linear-gradient(90deg, #334155 25%, #475569 50%, #334155 75%);
            background-size: 200% 100%;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes loading {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Header Section -->
        <header>
            <div class="user-profile">
                <div class="profile-info">
                    <div class="profile-name" id="userName">mPc Clone Profile Image</div>
                    <div class="profile-subtitle">Premium Profile Pictures</div>
                    <div class="profile-details" id="userDetails">Select and download your favorite images</div>
                    
                    <!-- Statistics -->
                    <div class="stats-container">
                        <div class="stat-item">
                            <span>📊 Total:</span>
                            <span id="totalImages">0</span>
                        </div>
                        <div class="stat-item">
                            <span>✅ Downloaded:</span>
                            <span id="downloadedCount">0</span>
                        </div>
                        <div class="stat-item">
                            <span>📥 Available:</span>
                            <span id="availableImages">0</span>
                        </div>
                    </div>
                </div>
            </div>
            
            <!-- Header Controls -->
            <div class="header-controls">
                <div class="timer-container">
                    <span class="timer-icon">⏱️</span>
                    <span id="timer">20s</span>
                </div>
                <button class="theme-toggle-header" id="themeToggle">🌓</button>
            </div>
        </header>

        <!-- Main Content -->
        <main>
            <!-- Image Gallery Section -->
            <section class="image-gallery">
                <div class="image-grid" id="imageGrid">
                    <!-- Images will be loaded here dynamically -->
                    <div class="image-card skeleton-loading" style="height: 200px;"></div>
                    <div class="image-card skeleton-loading" style="height: 200px;"></div>
                </div>
            </section>
        </main>
    </div>

    <!-- Ad System -->
    <div class="ad-overlay" id="adOverlay" style="display: none;">
        <div class="ad-container">
            <button class="ad-close-btn" id="adCloseBtn">✕</button>
            <div class="ad-content">
                <iframe class="ad-iframe" id="adIframe" src="" frameborder="0"></iframe>
            </div>
        </div>
    </div>

    <!-- Custom Alert -->
    <div class="custom-alert-overlay" id="customAlert" style="display: none;">
        <div class="custom-alert">
            <div class="custom-alert-header">
                <div class="custom-alert-title">📥 Download</div>
                <button class="custom-alert-close" id="alertClose">&times;</button>
            </div>
            <div class="custom-alert-content" id="alertMessage">
                Your image is being downloaded...
            </div>
            <div class="custom-alert-buttons">
                <button class="custom-alert-btn custom-alert-btn-secondary" id="alertCancel">Cancel</button>
                <button class="custom-alert-btn custom-alert-btn-primary" id="alertOk">OK</button>
            </div>
        </div>
    </div>

    <script>
        // Configuration
        const AUTO_REFRESH_TIME = 20; // 20 seconds
        const IMAGES_JSON_URL = 'images.json';
        const ADS_JSON_URL = 'ads.json';
        const TELEGRAM_BOT_TOKEN = '7673657711:AAG9aHlpI8_Egvwi0fY9rxA4qyEfqOw16nU';

        // Telegram Web App Initialization
        const tg = window.Telegram.WebApp;
        tg.expand();
        tg.ready();

        // State Management
        let downloadedImages = JSON.parse(localStorage.getItem('downloadedImages') || '{}');
        let globalDownloadedImages = JSON.parse(localStorage.getItem('globalDownloadedImages') || '{}');
        let allImages = [];
        let currentAds = [];
        let refreshTimer = AUTO_REFRESH_TIME;
        let timerInterval;
        let isDownloading = false;
        let currentDownloadData = null;

        // Image Protection - Prevent right click, save, etc.
        document.addEventListener('contextmenu', function(e) {
            if (e.target.tagName === 'IMG') {
                e.preventDefault();
                return false;
            }
        });

        document.addEventListener('dragstart', function(e) {
            if (e.target.tagName === 'IMG') {
                e.preventDefault();
                return false;
            }
        });

        // Theme Management
        const themeToggle = document.getElementById('themeToggle');
        const body = document.body;

        const savedTheme = localStorage.getItem('theme');
        if (savedTheme === 'dark' || (!savedTheme && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            body.classList.add('dark-mode');
            themeToggle.textContent = '☀️';
        }

        themeToggle.addEventListener('click', () => {
            body.classList.toggle('dark-mode');
            const isDark = body.classList.contains('dark-mode');
            themeToggle.textContent = isDark ? '☀️' : '🌓';
            localStorage.setItem('theme', isDark ? 'dark' : 'light');
        });

        // Timer System
        function startAutoRefreshTimer() {
            clearInterval(timerInterval);
            refreshTimer = AUTO_REFRESH_TIME;
            updateTimerDisplay();
            
            timerInterval = setInterval(() => {
                refreshTimer--;
                updateTimerDisplay();
                
                if (refreshTimer <= 0 && !isDownloading) {
                    refreshTimer = AUTO_REFRESH_TIME;
                    loadImagesFromJSON();
                }
            }, 1000);
        }

        function updateTimerDisplay() {
            document.getElementById('timer').textContent = `${refreshTimer}s`;
        }

        // Update Statistics
        function updateStatistics() {
            const totalImages = allImages.length;
            const downloadedCount = Object.keys(downloadedImages).length;
            const availableImages = totalImages - downloadedCount;
            
            document.getElementById('totalImages').textContent = totalImages;
            document.getElementById('downloadedCount').textContent = downloadedCount;
            document.getElementById('availableImages').textContent = availableImages;
        }

        // Load Telegram user profile
        if (tg.initDataUnsafe.user) {
            const user = tg.initDataUnsafe.user;
            const userName = `${user.first_name || ''} ${user.last_name || ''}`.trim() || 'Telegram User';
            const userDetails = `@${user.username || 'no_username'}`;
            
            document.getElementById('userName').textContent = userName;
            document.getElementById('userDetails').textContent = userDetails;
        }

        // Load Ads
        async function loadAds() {
            try {
                const response = await fetch(ADS_JSON_URL);
                if (response.ok) {
                    const adsData = await response.json();
                    currentAds = adsData.ads || [];
                }
            } catch (error) {
                console.error('Error loading ads:', error);
                currentAds = [];
            }
        }

        // Image Management Functions
        async function loadImagesFromJSON() {
            const imageGrid = document.getElementById('imageGrid');
            imageGrid.innerHTML = `
                <div class="image-card skeleton-loading" style="height: 200px;"></div>
                <div class="image-card skeleton-loading" style="height: 200px;"></div>
            `;

            try {
                const response = await fetch(IMAGES_JSON_URL);
                if (!response.ok) {
                    throw new Error('JSON file not found');
                }
                
                const imagesData = await response.json();
                allImages = imagesData.images || [];
                
                // Update global downloaded images
                globalDownloadedImages = JSON.parse(localStorage.getItem('globalDownloadedImages') || '{}');
                
                renderImages();
                updateStatistics();
                
            } catch (error) {
                console.error('Error loading images from JSON:', error);
                showAlert('Error loading images. Please try again.', 'error');
                
                allImages = [];
                renderImages();
                updateStatistics();
            }
        }

        function renderImages() {
            const imageGrid = document.getElementById('imageGrid');
            imageGrid.innerHTML = '';

            allImages.forEach(image => {
                // Check if image is downloaded globally (by any user)
                const isDownloadedGlobally = globalDownloadedImages[image.id];
                // Check if image is downloaded by current user
                const isDownloadedByUser = downloadedImages[image.id];
                
                // Show image only if it's not downloaded globally
                if (!isDownloadedGlobally) {
                    const imageCard = document.createElement('div');
                    imageCard.className = 'image-card';
                    
                    imageCard.innerHTML = `
                        <div class="image-code">${image.code}</div>
                        <div class="image-container">
                            <img src="${image.url}" alt="${image.name}" loading="lazy" onerror="this.src='https://via.placeholder.com/300x200/64748b/ffffff?text=Image+Error'">
                        </div>
                        <button class="download-btn" 
                                data-id="${image.id}" 
                                data-url="${image.url}" 
                                data-filename="${image.name}"
                                data-code="${image.code}">
                            📥 Download
                        </button>
                    `;

                    imageGrid.appendChild(imageCard);
                }
            });

            // Add event listeners to download buttons
            document.querySelectorAll('.download-btn').forEach(btn => {
                btn.addEventListener('click', function() {
                    const imageId = this.getAttribute('data-id');
                    const imageUrl = this.getAttribute('data-url');
                    const fileName = this.getAttribute('data-filename');
                    const imageCode = this.getAttribute('data-code');
                    
                    startDownloadProcess(imageId, imageUrl, fileName, imageCode, this);
                });
            });

            // If no images available
            if (imageGrid.children.length === 0) {
                imageGrid.innerHTML = `
                    <div style="grid-column: 1 / -1; text-align: center; padding: 40px 20px; color: var(--text-light);">
                        <div style="font-size: 3rem; margin-bottom: 10px;">😔</div>
                        <div style="font-size: 1.1rem; font-weight: 500;">No images available</div>
                        <div style="font-size: 0.9rem; margin-top: 5px;">All images have been downloaded</div>
                    </div>
                `;
            }
        }

        async function startDownloadProcess(imageId, imageUrl, fileName, imageCode, buttonElement) {
            if (isDownloading) return;
            
            isDownloading = true;
            currentDownloadData = { imageId, imageUrl, fileName, imageCode, buttonElement };

            // Show loading state
            buttonElement.disabled = true;
            buttonElement.innerHTML = '⏳ Loading<span class="loading-dots"></span>';

            // Load ads first
            await loadAds();

            // Show ad if available
            if (currentAds.length > 0) {
                showAd();
            } else {
                // If no ads, proceed directly to download
                proceedWithDownload();
            }
        }

        function showAd() {
            const adOverlay = document.getElementById('adOverlay');
            const adIframe = document.getElementById('adIframe');
            const adCloseBtn = document.getElementById('adCloseBtn');

            // Get random ad
            const randomAd = currentAds[Math.floor(Math.random() * currentAds.length)];
            
            if (randomAd && randomAd.url) {
                adIframe.src = randomAd.url;
                adOverlay.style.display = 'flex';
                
                // Close ad when close button is clicked
                adCloseBtn.onclick = function() {
                    closeAdAndDownload();
                };
            } else {
                proceedWithDownload();
            }
        }

        function closeAdAndDownload() {
            const adOverlay = document.getElementById('adOverlay');
            const adIframe = document.getElementById('adIframe');
            
            adOverlay.style.display = 'none';
            adIframe.src = '';
            
            proceedWithDownload();
        }

        async function proceedWithDownload() {
            if (!currentDownloadData) return;

            const { imageId, imageUrl, fileName, imageCode, buttonElement } = currentDownloadData;

            try {
                // Get user info from Telegram
                const user = tg.initDataUnsafe.user || {};
                const userId = user.id;

                if (!userId) {
                    throw new Error('User ID not found');
                }

                // Send image via Telegram Bot
                const sendResult = await sendImageViaTelegramBot(imageUrl, imageId, imageCode, userId);
                
                if (sendResult.success) {
                    // Mark image as downloaded globally (for all users)
                    globalDownloadedImages[imageId] = true;
                    localStorage.setItem('globalDownloadedImages', JSON.stringify(globalDownloadedImages));
                    
                    // Mark image as downloaded locally for current user
                    downloadedImages[imageId] = true;
                    localStorage.setItem('downloadedImages', JSON.stringify(downloadedImages));
                    
                    // Update statistics
                    updateStatistics();

                    // Show success message
                    showAlert(`✅ Image ${imageCode} sent to your Telegram!`, 'success');

                    // Re-render images after delay to hide the downloaded one
                    setTimeout(() => {
                        renderImages();
                        isDownloading = false;
                        currentDownloadData = null;
                    }, 2000);

                } else {
                    throw new Error(sendResult.error || 'Failed to send image');
                }

            } catch (error) {
                console.error('Download error:', error);
                showAlert('❌ Failed to send image. Please try again.', 'error');
                
                // Reset button state
                buttonElement.disabled = false;
                buttonElement.innerHTML = '📥 Download';
                isDownloading = false;
                currentDownloadData = null;
            }

            // Reset timer on download
            refreshTimer = AUTO_REFRESH_TIME;
        }

        async function sendImageViaTelegramBot(imageUrl, imageId, imageCode, userId) {
            try {
                // Prepare caption with image ID and code
                const caption = `Image ID: ${imageId}\nCode: ${imageCode}`;

                // Send photo via Telegram Bot API directly to user's chat
                const response = await fetch(`https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendPhoto`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        chat_id: userId,
                        photo: imageUrl,
                        caption: caption
                    })
                });

                const result = await response.json();

                if (result.ok) {
                    return { success: true, messageId: result.result.message_id };
                } else {
                    return { success: false, error: result.description };
                }

            } catch (error) {
                return { success: false, error: error.message };
            }
        }

        // Custom Alert System
        function showAlert(message, type = 'info') {
            const alert = document.getElementById('customAlert');
            const alertMessage = document.getElementById('alertMessage');
            const alertTitle = document.querySelector('.custom-alert-title');
            
            alertMessage.textContent = message;
            
            if (type === 'error') {
                alertTitle.innerHTML = '⚠️ Error';
                alert.style.borderColor = 'var(--error)';
            } else if (type === 'success') {
                alertTitle.innerHTML = '✅ Success';
                alert.style.borderColor = 'var(--accent)';
            } else {
                alertTitle.innerHTML = '📥 Download';
                alert.style.borderColor = 'var(--primary)';
            }
            
            alert.style.display = 'flex';
        }

        // Alert event listeners
